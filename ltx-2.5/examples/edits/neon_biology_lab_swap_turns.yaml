# Reverse the dialogue: the android answers first, then the scientist speaks.
# Both lines keep their generated audio; only their positions change.
# Output: <run>/edits/swap_turns/
id: swap_turns

stems:
  scientist_voice:
    # New start (seconds) of each window, or null to keep it; window lengths are kept.
    retime: [6.3]   # was 3.1-6.0
  android_voice:
    retime: [3.1]   # was 6.3-9.2
